[package]
name = "kourier-threema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are one binary, tests/it.rs (T3); a new tests/<name>.rs is a `mod` there.
autotests = false

[dependencies]
kourier-model.workspace = true
kourier-backend-api.workspace = true
kourier-db.workspace = true

# The transports' traits (src/parts.rs): async methods behind `dyn`, and the WebSocket's stream.
async-trait.workspace = true
async-channel.workspace = true

# libthreema at the vendored commit with Kourier's patches (root Cargo.toml, third_party/libthreema/VENDORED.md).
libthreema.workspace = true

thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "net", "io-util"] }

# THE REAL CONNECTORS (TH3, `src/dial/` only: tests/builder.rs rules 1 and 11). Crate-local, with the
# versions already in the lock: TH3 adds no package (lane decision L8). No OpenSSL anywhere (deny.toml)
# and no aws-lc: tokio-rustls's DEFAULT features turn on `rustls/aws_lc_rs` for the whole graph, so
# `default-features = false` is a MUST; the provider is ring, passed explicitly (no global default).
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The Mozilla roots: the chain check beside the pins (Desktop demands both, TH3 decision M6).
webpki-roots = "1"
# `handshake`: the client and server handshakes, a subset of the default libsignal builds.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
reqwest.workspace = true
http.workspace = true
futures-util = { workspace = true, features = ["sink"] }
# The pins are SHA-256 of the leaf's SPKI, written in base64 as Desktop writes them.
sha2.workspace = true
base64.workspace = true
# The type of `AccountContext::cancel`.
tokio-util.workspace = true
tracing.workspace = true
# CK, DGK and the device cookie are held in `Zeroizing` (src/store.rs).
zeroize.workspace = true
# The join URL's payload (TH4, src/proto.rs): `url-payloads.proto`, the one protocol file libthreema does
# not build, compiled by build.rs onto libthreema's generated `common` and `d2d_rendezvous` types. The
# offline fake (tests/support/mock/) decodes libthreema's generated types with it as well.
prost.workspace = true
# The join QR's secrets (src/join/qr.rs): the workspace's rand, already in the lock.
rand.workspace = true
# A file message's JSON body (TH5b B1, src/reflect/body.rs): the workspace's serde_json, already in the lock
# (no package added; the one lock line is this crate's dependency list).
serde_json.workspace = true

[build-dependencies]
prost-build.workspace = true

[dev-dependencies]
# The kill tests need their failpoints in release test builds too (§10.4).
kourier-db = { workspace = true, features = ["failpoints"] }
# The descriptor twin (TH4 K1, decision L7: `tests/network.rs`): the fake that plays Threema copies
# this crate's descriptor. A dev-dependency on the fake is the one edge `deps-check` allows tests.
kourier-fake.workspace = true
tempfile.workspace = true
# The source check reads the manifests (tests/builder.rs rule 8: libthreema gets no feature).
toml.workspace = true
# The parent-resident fake (TH5a A3, tests/support/mock/pipe.rs): moving the child's pipe ends above
# fd 9, their `dup2` to fds 3 and 4 in `pre_exec`, `O_NONBLOCK` for `AsyncFd`. In the lock already.
libc.workspace = true
# `test-util`: the paused clock of the connector tests (tests/mock/connector.rs); a feature, no package.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
# The offline fake's OWN crypto (tests/support/mock/, TH2): the registry crates, never libthreema's
# protocol or crypto code, so "the real client against the fake" stays a check by two
# implementations (lane plan §2.4). Crate-local, with the versions already in the lock (libthreema
# and argon2 bring them): TH2 adds no package (lane decision L8). blake2 is the REGISTRY 0.10.6
# (`&[u8]` keys), not libthreema's patched copy.
blake2 = "0.10.6"
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "salsa20"] }
salsa20 = "0.10.2"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
rand_chacha = "0.3.1"
# The fake's rendezvous RRD (TH4 J2, tests/support/mock/joiner.rs): ChaCha20-Poly1305 of the spec,
# the REGISTRY crate already in the lock (0.10.1, libthreema's own); `alloc` for `Aead::encrypt`.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }

[[test]]
name = "it"
path = "tests/it.rs"
