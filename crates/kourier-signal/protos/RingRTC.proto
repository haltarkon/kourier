// the file last changed in ae68dc8b, 2026-08-13). It is the mock server's trimmed copy of
// RingRTC's signaling proto (signalapp/ringrtc) and the only copy of that proto on disk; it
// holds what a device that takes no calls needs of `CallMessage.opaque.data`: the ring of a
// group call. Do not edit: re-copy on every Desktop bump (docs/architecture.md §6.15) and
// keep this header.

