[package]
name = "kourier-qt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Lets dependent crates link the QML module's object files (cxx-qt multi-crate export).
links = "kourier_qt"

[features]
# A measuring build (`cargo xtask perf`, architecture §1.3): bundles the scripted session
# `perf/PerfDriver.qml` and takes its name in `UiOptions::perf_scenario`.
perf = ["kourier-app/perf"]

[dependencies]
# The binary picks the networks (`signal`, `fake`); the UI needs only what every build has.
kourier-app = { path = "../kourier-app", default-features = false }
kourier-model.workspace = true
kourier-viewmodel.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
cxx-qt-lib-extras.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing.workspace = true
# The development control channel of debug builds (`--dev-control`, src/dev/).
serde_json.workspace = true
thiserror.workspace = true
# Decrypted media bytes on their way to Qt (the image provider, src/media.rs).
zeroize.workspace = true

[dev-dependencies]
# `tests/core_ui.rs` runs the real core over the fake network.
kourier-app = { path = "../kourier-app", default-features = false, features = ["fake"] }
# `tests/folder_ui.rs` reads back the archive a folder was sent as.
zip.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

