[package]
name = "kourier-fake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are one binary, tests/it.rs (T3); a new tests/<name>.rs is a `mod` there.
autotests = false

[dependencies]
kourier-model.workspace = true
kourier-backend-api.workspace = true
kourier-db.workspace = true
kourier-blob.workspace = true
kourier-media.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[[test]]
name = "it"
path = "tests/it.rs"
