version = 1
SPDX-PackageName = "Kourier"
# TODO(maintainer): the project's final name, its download location and a contact go here
# (SPDX-PackageDownloadLocation, SPDX-PackageSupplier) once the name and the hosting are chosen.

# How this tree is annotated for the REUSE specification (https://reuse.software). Files are
# annotated here by path, not by a header line in each file, so a source file stays free of
# boilerplate. A file that carries its own SPDX header (the .proto files, the mock harness's
# .mjs files) keeps it: the header wins over a path annotation.
#
# Three licenses are in use (texts in LICENSES/):
#   AGPL-3.0-only  the code, the documents and the icons. libsignal is AGPL-3.0-only, and the
#                  project takes contributions under the license it ships under.
#   CC0-1.0        build and tool configuration, package metadata, generated data and test
#                  fixtures: nothing in them is worth a license condition, and AppStream and
#                  desktop-file metadata is conventionally public domain.
#   CC-BY-4.0      CODE_OF_CONDUCT.md only (the Contributor Covenant text).
#   BSL-1.0        Kourier's patches to TDLib (third_party/tdlib/patches/), whose context lines
#                  are TDLib's.
#
# TODO(maintainer): the copyright holder below is the "The Kourier developers" the AppStream
# metainfo names. Replace it with the name the project goes by (under a DCO sign-off every
# contributor keeps their copyright, so a collective name is the usual choice).

# The code, the documents and the icons.
[[annotations]]
path = [
    "crates/**/*.rs",
    "xtask/**/*.rs",
    "fuzz/**/*.rs",
    "crates/**/*.qml",
    "crates/**/*.cpp",
    "crates/**/*.h",
    "crates/**/*.sql",
    "tests/**/*.mjs",
    "scripts/*.sh",
    "scripts/*.py",
    "**/*.md",
    "crates/kourier-qt/icons/*.svg",
    "packaging/*.svg",
    "po/**",
    "docs/screenshots/*.png",
]
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "AGPL-3.0-only"

# Build and tool configuration, package metadata and generated data.
[[annotations]]
path = [
    ".cargo/config.toml",
    ".config/nextest.toml",
    ".gitattributes",
    ".gitignore",
    "**/Cargo.toml",
    "Cargo.lock",
    "crates/kourier-telegram/fakedc/Cargo.lock",
    "rust-toolchain.toml",
    "crates/kourier-qt/clippy.toml",
    "deny.toml",
    "about.toml",
    "about.hbs",
    "cliff.toml",
    "tests/mock-harness/package.json",
    "tests/mock-harness/package-lock.json",
    "crates/kourier-core/tests/ingest.proptest-regressions",
    "packaging/*.desktop",
    "packaging/*.metainfo.xml",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "CC0-1.0"

# Throwaway certificates and keys generated for the coexistence test (kourier-coexist); they
# protect nothing.
[[annotations]]
path = "crates/kourier-coexist/fixtures/*.der"
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "CC0-1.0"

# The Contributor Covenant text, with the project's contact line filled in.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = "2021 Organization for Ethical Source (Contributor Covenant)"
SPDX-License-Identifier = "CC-BY-4.0"
precedence = "override"

# Third-party files that were copied into the tree. The five Signal .proto files carry their
# own SPDX headers (Signal Messenger, LLC, AGPL-3.0-only) and need no entry here.

# Signal Messenger's certificate authority for its storage and CDN hosts, taken from Signal
# Desktop's config/default.json (AGPL-3.0-only). A public certificate, trusted by
# kourier-signal/src/net/env.rs and nothing else.
[[annotations]]
path = "crates/kourier-signal/src/net/signal-messenger-ca.pem"
SPDX-FileCopyrightText = "Signal Messenger, LLC"
SPDX-License-Identifier = "AGPL-3.0-only"

# A known-answer test vector (a 32-byte plaintext, encrypted by Signal's client library),
# copied from libsignal-service-rs src/kat.bin.rs (AGPL-3.0-only); the copyright holders are
# those that project's README lists.
[[annotations]]
path = "crates/kourier-signal/testdata/lss_attachment_kat.in"
SPDX-FileCopyrightText = [
    "2015-2019 Open Whisper Systems",
    "2020-2023 Signal Messenger, LLC",
    "2019-2025 Ruben De Smet",
    "2019-2025 Gabriel Féron",
    "2019-2025 Whisperfish contributors",
]
SPDX-License-Identifier = "AGPL-3.0-only"

# Signal's backup format, copied unchanged from libsignal at tag v0.104.0
# (rust/message-backup/src/proto/backup.proto; the file has no header of its own) and two of
# libsignal's encrypted test archives from the same tag (rust/message-backup/tests/res/test-cases/
# valid-encrypted/), which the reader's tests open (kourier-signal `archive`). AGPL-3.0-only,
# copyright as the project states it (libsignal README: 2020-2026; this file since 2023).
[[annotations]]
path = [
    "crates/kourier-signal/protos/backup.proto",
    "crates/kourier-signal/testdata/libsignal/*.encrypted",
]
SPDX-FileCopyrightText = "2023-2026 Signal Messenger, LLC"
SPDX-License-Identifier = "AGPL-3.0-only"

# whatsapp-rust's own store contract tests, copied VERBATIM into kourier-whatsapp's tests (MIT,
# oxidezap/whatsapp-rust at rev 50a723d4; the upstream holder is named in the annotations below): the two
# helpers of wacore/tests/support/, and the repro (wacore/tests/storage_contract_repro.rs), which
# Kourier edited to run over its own store (hence both licences). Re-copy on every pin bump.
# These annotations come after the `crates/**/*.rs` one: the last match wins.
[[annotations]]
path = "crates/kourier-whatsapp/tests/support/upstream/*.rs"
SPDX-FileCopyrightText = "2025 João Lucas de Oliveira Lopes"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "crates/kourier-whatsapp/tests/storage_contract_repro.rs"
SPDX-FileCopyrightText = [
    "2025 João Lucas de Oliveira Lopes",
    "2026 The Kourier developers",
]
SPDX-License-Identifier = "MIT AND AGPL-3.0-only"

# The key rule of a history row's message secrets (`group_participant_raw`, `history_msg_secret_senders`),
# ADAPTED from whatsapp-rust's `src/history_sync.rs` (MIT, rev 50a723d4) so that Kourier's delivery writes
# the same (chat, sender, id) upstream's own seeding writes. Re-check it on every pin bump.
[[annotations]]
path = "crates/kourier-whatsapp/src/history/secrets.rs"
SPDX-FileCopyrightText = [
    "2025 João Lucas de Oliveira Lopes",
    "2026 The Kourier developers",
]
SPDX-License-Identifier = "MIT AND AGPL-3.0-only"

# Fixtures generated by the tests of kourier-whatsapp from fixed TEST keys (a serialized device that
# must load at every pin bump): nothing in them protects anything.
[[annotations]]
path = "crates/kourier-whatsapp/testdata/*"
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "CC0-1.0"

# The scrubbed TDLib login flow of the spike's fake data centre and the scripted TDLib's rules cut
# from it (TG-2): synthetic numbers, names and texts only, nothing of a real account.
[[annotations]]
path = "crates/kourier-telegram/testdata/*"
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "CC0-1.0"

# The pin of the TDLib build (`cargo xtask tdlib`, third_party/tdlib/tdlib.pin): build configuration.
[[annotations]]
path = "third_party/tdlib/tdlib.pin"
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "CC0-1.0"

# Kourier's patches to TDLib, applied before the build (`cargo xtask tdlib build`). Their context lines
# are TDLib's (Boost Software License 1.0, tdlib/td at the pinned commit); the patches are under the
# same licence.
[[annotations]]
path = "third_party/tdlib/patches/*.patch"
SPDX-FileCopyrightText = [
    "2014-2026 Aliaksei Levin, Arseny Smirnov",
    "2026 The Kourier developers",
]
SPDX-License-Identifier = "BSL-1.0"

# libthreema, vendored from threema-ios (third_party/libthreema/VENDORED.md names the commit, the
# files dropped and the local patches). Its files carry no SPDX header; the licence is the one its
# workspace manifest states (AGPL-3.0-only), the copyright Threema AG's (the repository's README).
# These come after every other table and override them, so that `**/Cargo.toml` (CC0) and
# `**/*.md` (Kourier's) do not claim Threema's files; of several override tables that match, the
# LAST wins (checked with `reuse spdx`).
[[annotations]]
path = "third_party/libthreema/**"
SPDX-FileCopyrightText = "Threema AG"
SPDX-License-Identifier = "AGPL-3.0-only"
precedence = "override"

# The patched blake2 crate libthreema carries (RustCrypto's blake2 0.10.6 with Threema's change).
[[annotations]]
path = "third_party/libthreema/patches/blake2/**"
SPDX-FileCopyrightText = "RustCrypto Developers"
SPDX-License-Identifier = "MIT OR Apache-2.0"
precedence = "override"

# Kourier's own record of the vendored copy, and its rustfmt switch.
[[annotations]]
path = ["third_party/libthreema/VENDORED.md", "third_party/libthreema/rustfmt.toml"]
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "AGPL-3.0-only"
precedence = "override"

# The vendored files Kourier's patches (P1-P6, P9, P10, P11) change (VENDORED.md, the patch table): Threema AG's work
# with Kourier's changes, under the same licence. After the libthreema/** block, so this one wins.
[[annotations]]
path = [
    "third_party/libthreema/Cargo.toml",
    "third_party/libthreema/Cargo.lock",
    "third_party/libthreema/dependencies/Cargo.toml",
    "third_party/libthreema/lib/Cargo.toml",
    "third_party/libthreema/macros/Cargo.toml",
    "third_party/libthreema/lib/src/common/config.rs",
    "third_party/libthreema/lib/src/common/keys.rs",
    "third_party/libthreema/lib/src/common/mod.rs",
    "third_party/libthreema/lib/src/crypto/mod.rs",
    "third_party/libthreema/lib/src/csp/payload/handshake.rs",
    "third_party/libthreema/lib/src/csp_e2e/message/task/incoming.rs",
    "third_party/libthreema/lib/src/csp_e2e/reflect.rs",
    "third_party/libthreema/lib/src/csp_e2e/transaction/manager.rs",
    "third_party/libthreema/lib/src/d2d_rendezvous/rxdtk.rs",
    "third_party/libthreema/lib/src/d2m/payload/handshake.rs",
    "third_party/libthreema/lib/src/d2m/payload/post_handshake.rs",
    "third_party/libthreema/lib/src/https/mod.rs",
]
SPDX-FileCopyrightText = ["Threema AG", "2026 The Kourier developers"]
SPDX-License-Identifier = "AGPL-3.0-only"
precedence = "override"

# Kourier's ports of Threema Desktop's mocha specs (TH5a A9b: the reflected receive tasks; TH6a S7: the outgoing
# messages; each file's header names the source and its commit): Threema AG's test cases as sequence oracles. Behaviour
# is ported, not code, and still Threema AG stands beside Kourier, under the same licence, as for every file ported
# from Desktop. After the `crates/**/*.rs` block (Kourier's), so this one wins.
[[annotations]]
path = [
    "crates/kourier-threema/tests/connection/desktop_cases.rs",
    "crates/kourier-threema/tests/connection/send_desktop.rs",
]
SPDX-FileCopyrightText = ["Threema AG", "2026 The Kourier developers"]
SPDX-License-Identifier = "AGPL-3.0-only"
precedence = "override"

# TH6 L7: Desktop's incoming specs as sequence oracles (behaviour ported, no code copied; the same holders as the file above).
[[annotations]]
path = "crates/kourier-threema/tests/connection/leader_desktop.rs"
SPDX-FileCopyrightText = ["Threema AG", "2026 The Kourier developers"]
SPDX-License-Identifier = "AGPL-3.0-only"
precedence = "override"

# The blake2 manifest patch P3 renames: RustCrypto's file with Kourier's change. After the
# patches/blake2/** block, so this one wins.
[[annotations]]
path = "third_party/libthreema/patches/blake2/Cargo.toml"
SPDX-FileCopyrightText = ["RustCrypto Developers", "2026 The Kourier developers"]
SPDX-License-Identifier = "MIT OR Apache-2.0"
precedence = "override"

# The two blake2 source files Threema's change touches (the crate's README: a patch to generate a
# non-keyed hash with parameters): RustCrypto's files with Threema's change, so both holders. After the
# patches/blake2/** block, so this one wins.
[[annotations]]
path = [
    "third_party/libthreema/patches/blake2/src/macros.rs",
    "third_party/libthreema/patches/blake2/src/as_bytes.rs",
]
SPDX-FileCopyrightText = ["RustCrypto Developers", "Threema AG"]
SPDX-License-Identifier = "MIT OR Apache-2.0"
precedence = "override"

# grammers-tl-types 0.11.0 with grammers' layer-232 api.tl, vendored for the fake DC (TEST ONLY;
# crates/kourier-telegram/fakedc/vendor/grammers-tl-types/VENDORED.md names the sources and how it
# was taken). The crates.io package has no licence file and no SPDX header; the licence is the one
# its manifest states (MIT OR Apache-2.0, both texts in LICENSES/), the copyright the grammers
# project's (codeberg.org/Lonami/grammers). These come after every other table and override them,
# so that `crates/**/*.rs`, `**/*.md` (Kourier's) and `**/Cargo.toml` (CC0) do not claim grammers'
# files; of several override tables that match, the LAST wins (checked with `reuse spdx`).
[[annotations]]
path = "crates/kourier-telegram/fakedc/vendor/grammers-tl-types/**"
SPDX-FileCopyrightText = "developers of the grammers project"
SPDX-License-Identifier = "MIT OR Apache-2.0"
precedence = "override"

# Kourier's own record of the vendored copy, and its rustfmt switch.
[[annotations]]
path = [
    "crates/kourier-telegram/fakedc/vendor/grammers-tl-types/VENDORED.md",
    "crates/kourier-telegram/fakedc/vendor/grammers-tl-types/rustfmt.toml",
]
SPDX-FileCopyrightText = "2026 The Kourier developers"
SPDX-License-Identifier = "AGPL-3.0-only"
precedence = "override"
