# git-cliff configuration (https://git-cliff.org): `git cliff --unreleased` drafts the next
# CHANGELOG.md section from the commit subjects.
#
# Subjects are `Area: what changed` (CONTRIBUTING.md), not Conventional Commits, so commits
# are grouped by the area before the colon. A human then edits the draft into notes a user can
# read: this output is a starting point, not the changelog.

[changelog]
header = """
# Changelog

All notable changes to this project are written here. The format follows \
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the project follows \
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
# The commits are not Conventional Commits: leave them whole and group them by pattern.
conventional_commits = false
filter_unconventional = false
split_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# First match wins. The pattern is the area before the colon in the subject.
commit_parsers = [
    { message = '^(UI|Timeline|Read more)', group = "User interface" },
    { message = '^Signal', group = "Signal backend" },
    { message = '^(Core|core|Contract|App)\b', group = "Core" },
    { message = '^(cargo xtask|chore)', group = "Tooling" },
    { message = '^docs', group = "Documentation" },
    { message = '^S[0-9]+', group = "Build steps" },
    { message = '.*', group = "Other" },
]
